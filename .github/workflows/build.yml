name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS 语法
        run: |
          set -e
          git ls-files '*.js' '*.cjs' | while IFS= read -r f; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: 网页冒烟测试
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: LuCI 页面可加载
        run: |
          node -e "new Function('view','_','E','require', require('fs').readFileSync('openwrt/htdocs/luci-static/resources/view/tingshu/main.js','utf8'))"
          echo "ok  LuCI main.js"

      - name: Shell 语法
        run: |
          set -e
          # 只检查带 shebang 的文件，配置/JSON 跳过
          git ls-files 'openwrt/*' | while IFS= read -r f; do
            [ -f "$f" ] || continue
            head -c 2 "$f" | grep -q '#!' || continue
            sh -n "$f"
            echo "ok  $f"
          done

      - name: init 脚本自检
        run: |
          # 反斜杠续行一旦落成字面的 \n，uhttpd 会收到多余参数 n，-I/-x 全部失效（1.5.0 就是这样挂的）
          if grep -qF -- '\n' openwrt/files/etc/init.d/tingshu; then
            echo "::error::init.d 里出现了字面的反斜杠+n，检查 procd_set_param command 那一行"
            exit 1
          fi
          grep -qF -- '-x /cgi-ts' openwrt/files/etc/init.d/tingshu || {
            echo "::error::init.d 缺少 -x /cgi-ts，CGI 会被当成静态文件"
            exit 1
          }
          grep -qF -- '-I index.html' openwrt/files/etc/init.d/tingshu || {
            echo "::error::init.d 缺少 -I index.html"
            exit 1
          }
          echo 'init.d 参数检查通过'

      - name: Python 语法
        run: |
          python3 -m py_compile build_ipk.py
          echo "ok  build_ipk.py"

      - name: JSON 合法性
        run: |
          set -e
          for f in openwrt/root/usr/share/luci/menu.d/*.json openwrt/root/usr/share/rpcd/acl.d/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: 网页副本与根目录一致
        run: |
          set -e
          for f in index.html styles.css app.js icon.svg manifest.webmanifest; do
            cmp "$f" "openwrt/src/www/$f" || {
              echo "::error::$f 与 openwrt/src/www/$f 不一致，先跑 python build_ipk.py 同步"
              exit 1
            }
          done
          echo "副本一致"

      - name: 版本号一致
        run: |
          APP_VER=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" app.js)
          MK_VER=$(grep -oP '^PKG_VERSION:=\K.*' openwrt/Makefile)
          ANDROID_VER=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "app.js=$APP_VER Makefile=$MK_VER Android=$ANDROID_VER"
          [ "$APP_VER" = "$MK_VER" ] || {
            echo "::error::app.js 与 openwrt/Makefile 的版本号不一致"
            exit 1
          }
          [ "$APP_VER" = "$ANDROID_VER" ] || {
            echo "::error::app.js 与 android/app/build.gradle.kts 的 versionName 不一致"
            exit 1
          }

      - name: 确认没有 CRLF（会破坏 shebang）
        run: |
          if grep -rlU $'\r' openwrt/files openwrt/postinst openwrt/prerm build_ipk.py 2>/dev/null | grep -q . ; then
            echo "::error::脚本里存在 CRLF，安装后 shebang 会失效"
            exit 1
          fi
          echo "LF OK"

  package:
    name: 打包 ipk
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成 ipk
        run: python3 build_ipk.py

      - name: 校验包结构
        run: |
          python3 - <<'PY'
          import gzip, io, tarfile, glob, sys
          p = glob.glob('dist/*.ipk')[0]
          t = tarfile.open(fileobj=io.BytesIO(gzip.decompress(open(p,'rb').read())))
          names = [m.name for m in t.getmembers()]
          need = ['./debian-binary', './data.tar.gz', './control.tar.gz']
          for n in need:
              assert n in names, '缺少 ' + n
          ct = tarfile.open(fileobj=io.BytesIO(t.extractfile('./control.tar.gz').read()))
          assert './control' in [m.name for m in ct.getmembers()]
          print('ok', p, len(open(p,'rb').read()), 'bytes')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-tingshu-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true

  android:
    name: 打包 Android APK
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 SDK 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（进度同步协议）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: 编译 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 改名
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tingshu-android-$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tingshu-android-apk
          path: dist/tingshu-android-*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tingshu-android-*.apk
