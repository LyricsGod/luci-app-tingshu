name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS
        run: node --check app.js

      - name: 前端与 LuCI 页面
        run: |
          node --check openwrt/src/www/app.js
          node -e "new Function('view','_','E','require', require('fs').readFileSync('openwrt/htdocs/luci-static/resources/view/tingshu/main.js','utf8'))"
          echo "LuCI main.js OK"

      - name: Shell
        run: |
          set -e
          for f in \
            openwrt/files/etc/init.d/tingshu \
            openwrt/files/usr/lib/tingshu/scan.sh \
            openwrt/files/usr/lib/tingshu/api/progress \
            openwrt/files/usr/lib/tingshu/api/manage \
            openwrt/files/etc/uci-defaults/90-luci-app-tingshu \
            openwrt/postinst openwrt/prerm ; do
            sh -n "$f" && echo "ok  $f"
          done

      - name: JSON
        run: |
          set -e
          for f in openwrt/root/usr/share/luci/menu.d/*.json openwrt/root/usr/share/rpcd/acl.d/*.json ; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: 确认没有 CRLF（会破坏 shebang）
        run: |
          if grep -rlU $'\r' openwrt/files openwrt/postinst openwrt/prerm 2>/dev/null | grep -q . ; then
            echo "::error::脚本里存在 CRLF，安装后 shebang 会失效"
            exit 1
          fi
          echo "LF OK"

  package:
    name: 打包 ipk
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成 ipk
        run: python3 build_ipk.py

      - name: 校验包结构
        run: |
          python3 - <<'PY'
          import gzip, io, tarfile, glob, sys
          p = glob.glob('dist/*.ipk')[0]
          t = tarfile.open(fileobj=io.BytesIO(gzip.decompress(open(p,'rb').read())))
          names = [m.name for m in t.getmembers()]
          need = ['./debian-binary', './data.tar.gz', './control.tar.gz']
          for n in need:
              assert n in names, '缺少 ' + n
          ct = tarfile.open(fileobj=io.BytesIO(t.extractfile('./control.tar.gz').read()))
          assert './control' in [m.name for m in ct.getmembers()]
          print('ok', p, len(open(p,'rb').read()), 'bytes')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-tingshu-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
